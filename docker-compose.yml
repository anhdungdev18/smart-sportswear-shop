services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: dunghaiquyen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${DB_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/dev/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: dunghaiquyen
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_PARAMS: ""
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_FLYWAY_ENABLED: "true"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-min-32-bytes}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-min-32-bytes}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      APP_MAIL_PROVIDER: ${APP_MAIL_PROVIDER:-logging}
      APP_STORAGE_PROVIDER: ${APP_STORAGE_PROVIDER:-none}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      AI_SYNC_SECRET: ${AI_SYNC_SECRET:-dev-only-ai-sync-secret-change-me}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-DEVTMNCODE}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-dev-only-vnpay-hash-secret-change-me-please}
      PAYMENT_RETURN_URL: http://localhost:3000/payment/result
      PAYMENT_CALLBACK_URL: http://localhost:8082/api/v1/payments/callback
      PASSWORD_RESET_URL: http://localhost:3000/reset-password
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-postgres:
    profiles: ["separate-ai-db"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dunghaiquyen_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${AI_DB_HOST_PORT:-5435}:5432"
    volumes:
      - ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dunghaiquyen_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-forecasting:
    build: ./ai_forecasting_service
    environment:
      SERVER_PORT: 8081
      # Shared-DB mode for the current phase. Switch to ai-postgres/dunghaiquyen_ai
      # only when the separate-ai-db cutover is resumed.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: dunghaiquyen
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_PARAMS: ""
      CORE_API_BASE_URL: http://backend:8080
      AI_SYNC_SECRET: ${AI_SYNC_SECRET:-dev-only-ai-sync-secret-change-me}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-min-32-bytes}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-min-32-bytes}
      CORS_ALLOWED_ORIGINS: http://localhost:3001
      SPRING_FLYWAY_ENABLED: "true"
    ports:
      - "8081:8081"
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy

  storefront:
    build:
      context: ./frontend/storefront
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8082
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    environment:
      SERVER_API_BASE_URL: http://backend:8080
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8082
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  admin:
    build:
      context: ./frontend/admin
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8082
        NEXT_PUBLIC_AI_API_BASE_URL: http://localhost:8081
    environment:
      SERVER_API_BASE_URL: http://backend:8080
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8082
      SERVER_AI_API_BASE_URL: http://ai-forecasting:8081
      NEXT_PUBLIC_AI_API_BASE_URL: http://localhost:8081
    ports:
      - "3001:3001"
    depends_on:
      - backend
      - ai-forecasting

volumes:
  postgres_data:
  ai_postgres_data:
  redis_data:
