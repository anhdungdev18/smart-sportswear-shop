services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: dunghaiquyen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # host 5434 -> 5432 was taken by a native Postgres install, then 5433 by
      # another project's container on this dev machine (digiaisaleagent-db,
      # restarts automatically with Docker Desktop) - bump again rather than
      # touch a container outside this project.
      - "${DB_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/dev/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: dunghaiquyen
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_PARAMS: ""
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-min-32-bytes}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-min-32-bytes}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      APP_MAIL_PROVIDER: ${APP_MAIL_PROVIDER:-logging}
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${MANAGEMENT_HEALTH_MAIL_ENABLED:-false}
      APP_STORAGE_PROVIDER: ${APP_STORAGE_PROVIDER:-none}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      APP_SEED_DEMO_PASSWORD: ${APP_SEED_DEMO_PASSWORD:-Password123}
      APP_FORECAST_DEMO_ENABLED: ${APP_FORECAST_DEMO_ENABLED:-false}
      APP_FORECAST_DEMO_RANDOM_SEED: ${APP_FORECAST_DEMO_RANDOM_SEED:-2026}
      APP_FORECAST_DEMO_HISTORY_DAYS: ${APP_FORECAST_DEMO_HISTORY_DAYS:-180}
      APP_FORECAST_DEMO_ORDER_COUNT: ${APP_FORECAST_DEMO_ORDER_COUNT:-3000}
      APP_FORECAST_DEMO_VARIANT_COUNT: ${APP_FORECAST_DEMO_VARIANT_COUNT:-30}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-DEVTMNCODE}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-dev-only-vnpay-hash-secret-change-me-please}
      PAYMENT_RETURN_URL: ${PAYMENT_RETURN_URL:-http://localhost:3000/payment/result}
      PAYMENT_CALLBACK_URL: ${PAYMENT_CALLBACK_URL:-http://localhost:8080/api/v1/payments/callback}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:3000/reset-password}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  storefront:
    build:
      context: ./frontend/storefront
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    environment:
      SERVER_API_BASE_URL: http://backend:8080
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  admin:
    build:
      context: ./frontend/admin
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    environment:
      SERVER_API_BASE_URL: http://backend:8080
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
