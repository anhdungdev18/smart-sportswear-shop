server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ai-forecasting-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dunghaiquyen}${DB_PARAMS:}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 100
        jdbc.batch_size: 100
        order_inserts: true
        order_updates: true
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/ai-migration
    table: flyway_ai_schema_history
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  forecast:
    generation-parallelism: ${FORECAST_GENERATION_PARALLELISM:4}
    data-source: ${AI_FORECAST_DATA_SOURCE:REAL}
  core:
    base-url: ${CORE_API_BASE_URL:http://localhost:8080}
    sync-secret: ${AI_SYNC_SECRET:dev-only-ai-sync-secret-change-me}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001}
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:dev-only-access-secret-change-me-please-32-bytes-min}
    refresh-secret: ${JWT_REFRESH_SECRET:dev-only-refresh-secret-change-me-please-32-bytes}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}

ai:
  data-quality:
    min-history-days: ${AI_DATA_QUALITY_MIN_HISTORY_DAYS:60}
    high-history-days: ${AI_DATA_QUALITY_HIGH_HISTORY_DAYS:120}
    min-non-zero-days: ${AI_DATA_QUALITY_MIN_NONZERO_DAYS:12}
    high-non-zero-days: ${AI_DATA_QUALITY_HIGH_NONZERO_DAYS:30}
  demand-classification:
    min-history-days: ${AI_DEMAND_CLASSIFICATION_MIN_HISTORY_DAYS:60}
    min-non-zero-days: ${AI_DEMAND_CLASSIFICATION_MIN_NONZERO_DAYS:3}
    new-item-max-history-days: ${AI_DEMAND_CLASSIFICATION_NEW_ITEM_MAX_HISTORY_DAYS:30}
    intermittent-adi-threshold: ${AI_DEMAND_CLASSIFICATION_INTERMITTENT_ADI_THRESHOLD:1.32}
    erratic-cv-squared-threshold: ${AI_DEMAND_CLASSIFICATION_ERRATIC_CV_SQUARED_THRESHOLD:0.49}
    trend-slope-threshold: ${AI_DEMAND_CLASSIFICATION_TREND_SLOPE_THRESHOLD:0.03}
    algorithm-version: ${AI_DEMAND_CLASSIFICATION_ALGORITHM_VERSION:demand-classification-v1}
  forecast-evaluation:
    test-window-days: ${AI_FORECAST_TEST_WINDOW_DAYS:30}
    min-backtest-windows: ${AI_FORECAST_MIN_BACKTEST_WINDOWS:3}
    max-wape-high-confidence: ${AI_FORECAST_MAX_WAPE_HIGH_CONFIDENCE:0.30}
    max-wape-medium-confidence: ${AI_FORECAST_MAX_WAPE_MEDIUM_CONFIDENCE:0.60}
    max-abs-bias-high-confidence: ${AI_FORECAST_MAX_ABS_BIAS_HIGH_CONFIDENCE:0.25}
    algorithm-version: ${AI_FORECAST_EVALUATION_ALGORITHM_VERSION:forecast-evaluation-v2}
logging:
  level:
    com.dunghaiquyen.ecommerce: ${LOG_LEVEL:INFO}

